name: Deploy website & web app (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'package.json', 'package-lock.json', 'rspack.config.ts', 'tsconfig.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quality gates (type / lint / unit tests)
        run: |
          npm run type
          npm run lint
          npm test

      - name: Build web app
        run: npm run build

      - name: Assemble site (docs + web app at /app/)
        run: |
          mkdir -p site
          cp -r docs/. site/
          mkdir -p site/app
          cp -r dist/. site/app/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
